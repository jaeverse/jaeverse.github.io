<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How a WMS Works — Jae's Portfolio</title>
    <meta name="description" content="An animated top-down warehouse showing how a Warehouse Management System moves one order from inbound receiving to shipping.">
    <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">

    <script src="/js/theme-init.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=JetBrains+Mono:wght@400;600;700&family=Work+Sans:wght@400;500;600;700&display=swap">

    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/pages/wms.css">
</head>
<body data-page="wms">
    <a class="skip-link" href="#main">Skip to content</a>

    <div class="app">
        <aside class="sidebar" id="sidebar" aria-label="Site navigation"></aside>

        <div class="page">
            <header class="topbar" id="topbar"></header>

            <main class="main" id="main">

                <header class="page-header" data-reveal>
                    <div>
                        <p class="eyebrow">How a WMS works</p>
                        <h1>The warehouse, from above</h1>
                        <p>Follow one order from the inbound truck to the outbound one. It plays on its own; pause it, or click any step or zone to take a closer look.</p>
                    </div>
                </header>

                <div class="wms-layout">

                    <!-- ===== Top-down floor plan (animated by js/pages/wms.js) ===== -->
                    <figure class="wms-map" id="wms-map">
                        <div class="wms-map__scroll">
                            <svg class="wh" viewBox="0 0 1000 620" role="img" aria-labelledby="wh-title wh-desc">
                                <title id="wh-title">Warehouse floor plan</title>
                                <desc id="wh-desc">Top-down view of a warehouse: inbound dock and receiving on the left, storage racks and the order queue in the middle, packing and loading on the right, and the outbound truck outside the right wall.</desc>

                                <defs>
                                    <!-- One rack bin; repeated down each rack -->
                                    <pattern id="wh-bins" width="34" height="31.25" patternUnits="userSpaceOnUse">
                                        <rect class="wh-bin" width="34" height="31.25"/>
                                    </pattern>
                                </defs>

                                <!-- Building shell and dock doors -->
                                <rect class="wh-building" x="140" y="90" width="720" height="500" rx="8"/>
                                <rect class="wh-door" x="136" y="190" width="8" height="60"/>
                                <rect class="wh-door" x="136" y="310" width="8" height="60"/>
                                <rect class="wh-door" x="856" y="330" width="8" height="60"/>
                                <rect class="wh-door" x="856" y="450" width="8" height="60"/>

                                <!-- 1 · Inbound order receiving -->
                                <g class="wh-zone" data-zone="receiving" data-step="0">
                                    <rect class="wh-zone__area" x="10" y="160" width="124" height="130" rx="6"/>
                                    <rect class="wh-zone__area" x="160" y="110" width="130" height="460" rx="6"/>
                                    <circle class="wh-badge" cx="175" cy="130" r="12"/><text class="wh-badge__num" x="175" y="135">1</text>
                                    <text class="wh-label" x="194" y="135">RECEIVING</text>
                                    <text class="wh-label wh-label--small" x="22" y="282">INBOUND DOCK</text>
                                    <rect class="wh-pallet wh-pallet--idle" x="186" y="470" width="28" height="28" rx="3"/>
                                    <rect class="wh-pallet wh-pallet--idle" x="226" y="470" width="28" height="28" rx="3"/>
                                    <rect class="wh-pallet wh-pallet--idle" x="186" y="510" width="28" height="28" rx="3"/>
                                </g>

                                <!-- 2 · Receiving putaway (storage racks) -->
                                <g class="wh-zone" data-zone="storage" data-step="1">
                                    <rect class="wh-zone__area" x="320" y="110" width="290" height="330" rx="6"/>
                                    <circle class="wh-badge" cx="335" cy="130" r="12"/><text class="wh-badge__num" x="335" y="135">2</text>
                                    <text class="wh-label" x="354" y="135">STORAGE RACKS</text>
                                    <rect class="wh-rack" x="340" y="150" width="34" height="250"/>
                                    <rect class="wh-rack" x="410" y="150" width="34" height="250"/>
                                    <rect class="wh-rack" x="480" y="150" width="34" height="250"/>
                                    <rect class="wh-rack" x="550" y="150" width="34" height="250"/>
                                </g>

                                <!-- 3 · Order placed (customer → WMS order queue) -->
                                <g class="wh-zone" data-zone="orders" data-step="2">
                                    <rect class="wh-zone__area" x="440" y="8" width="160" height="66" rx="6"/>
                                    <rect class="wh-zone__area" x="320" y="470" width="290" height="100" rx="6"/>
                                    <circle class="wh-badge" cx="335" cy="490" r="12"/><text class="wh-badge__num" x="335" y="495">3</text>
                                    <text class="wh-label" x="354" y="495">ORDER QUEUE · WMS</text>
                                    <rect class="wh-ticket wh-ticket--idle" x="344" y="515" width="32" height="22" rx="3"/>
                                    <rect class="wh-ticket wh-ticket--idle" x="386" y="515" width="32" height="22" rx="3"/>
                                    <circle class="wh-customer" cx="470" cy="32" r="9"/>
                                    <path class="wh-customer" d="M455 62 q15 -22 30 0 z"/>
                                    <text class="wh-label wh-label--small" x="495" y="46">CUSTOMER</text>
                                </g>

                                <!-- 4 · Outbound order picking (path through the aisles) -->
                                <g class="wh-zone" data-zone="picking" data-step="3">
                                    <circle class="wh-badge" cx="335" cy="422" r="12"/><text class="wh-badge__num" x="335" y="427">4</text>
                                    <text class="wh-label" x="354" y="427">PICKING</text>
                                    <polyline class="wh-pickpath" points="465,462 392,462 392,165 462,165 462,395 532,395 532,165 597,165 597,185 700,185"/>
                                </g>

                                <!-- 5 · Packing -->
                                <g class="wh-zone" data-zone="packing" data-step="4">
                                    <rect class="wh-zone__area" x="630" y="110" width="210" height="150" rx="6"/>
                                    <circle class="wh-badge" cx="645" cy="130" r="12"/><text class="wh-badge__num" x="645" y="135">5</text>
                                    <text class="wh-label" x="664" y="135">PACKING</text>
                                    <rect class="wh-bench" x="660" y="165" width="150" height="38" rx="4"/>
                                    <rect class="wh-bench" x="660" y="215" width="150" height="26" rx="4"/>
                                </g>

                                <!-- 6 · Loading -->
                                <g class="wh-zone" data-zone="loading" data-step="5">
                                    <rect class="wh-zone__area" x="630" y="290" width="210" height="280" rx="6"/>
                                    <circle class="wh-badge" cx="645" cy="310" r="12"/><text class="wh-badge__num" x="645" y="315">6</text>
                                    <text class="wh-label" x="664" y="315">LOADING</text>
                                    <rect class="wh-lane" x="650" y="345" width="190" height="30" rx="4"/>
                                    <rect class="wh-lane" x="650" y="465" width="190" height="30" rx="4"/>
                                </g>

                                <!-- 7 · Shipping (outside the outbound door) -->
                                <g class="wh-zone" data-zone="shipping" data-step="6">
                                    <rect class="wh-zone__area" x="864" y="300" width="132" height="165" rx="6"/>
                                    <circle class="wh-badge" cx="880" cy="440" r="12"/><text class="wh-badge__num" x="880" y="445">7</text>
                                    <text class="wh-label" x="899" y="445">SHIPPING</text>
                                </g>

                                <!-- ===== Moving parts ===== -->
                                <g class="wh-truck wh-truck--in" id="wh-truck-in" transform="translate(130 220)">
                                    <rect class="wh-truck__trailer" x="-100" y="-25" width="80" height="50" rx="4"/>
                                    <rect class="wh-truck__cab" x="-20" y="-18" width="18" height="36" rx="4"/>
                                </g>

                                <g class="wh-truck wh-truck--out" id="wh-truck-out" transform="translate(870 360)">
                                    <rect class="wh-truck__trailer" x="0" y="-25" width="80" height="50" rx="4"/>
                                    <rect class="wh-truck__cab" x="82" y="-18" width="18" height="36" rx="4"/>
                                </g>

                                <g class="wh-token" id="wh-pallet" transform="translate(225 220)">
                                    <rect class="wh-pallet" x="-14" y="-14" width="28" height="28" rx="3"/>
                                    <line class="wh-pallet__slat" x1="-14" y1="0" x2="14" y2="0"/>
                                </g>

                                <g class="wh-token is-hidden" id="wh-ticket" transform="translate(520 525)">
                                    <rect class="wh-ticket" x="-16" y="-11" width="32" height="22" rx="3"/>
                                    <line class="wh-ticket__line" x1="-9" y1="-3" x2="9" y2="-3"/>
                                    <line class="wh-ticket__line" x1="-9" y1="4" x2="4" y2="4"/>
                                </g>

                                <g class="wh-token is-hidden" id="wh-picker" transform="translate(465 462)">
                                    <circle class="wh-picker" r="10"/>
                                    <circle class="wh-picker__dot" r="3"/>
                                </g>

                                <g class="wh-token is-hidden" id="wh-carton" transform="translate(700 182)">
                                    <rect class="wh-carton" x="-12" y="-10" width="24" height="20" rx="2"/>
                                    <rect class="wh-carton__label" x="-7" y="-4" width="14" height="8"/>
                                </g>

                                <text class="wh-shipped is-hidden" id="wh-shipped" x="930" y="345">SHIPPED ✓</text>
                            </svg>
                        </div>
                        <figcaption class="wms-map__hint">Swipe sideways to see the whole floor.</figcaption>
                    </figure>

                    <!-- ===== Step details and controls ===== -->
                    <div class="wms-panel">
                        <div class="wms-controls">
                            <button class="icon-btn" id="wms-prev" type="button" aria-label="Previous step"><span data-icon="chevron-left"></span></button>
                            <button class="btn btn--primary btn--small wms-controls__toggle" id="wms-toggle" type="button">Pause</button>
                            <button class="icon-btn" id="wms-next" type="button" aria-label="Next step"><span data-icon="chevron-right"></span></button>
                            <span class="wms-controls__count" id="wms-count">Step 1 of 7</span>
                        </div>

                        <div class="card wms-detail" id="wms-detail">
                            <h2 class="wms-detail__name" id="wms-step-name">Inbound Order Receiving</h2>
                            <p class="wms-detail__text" id="wms-step-text"></p>
                            <dl class="wms-detail__facts">
                                <dt>The WMS</dt>
                                <dd id="wms-step-system"></dd>
                                <dt>On the RF Gun</dt>
                                <dd class="mono" id="wms-step-rf"></dd>
                            </dl>
                        </div>

                        <ol class="wms-steps" id="wms-steps"></ol>
                    </div>
                </div>

            </main>

            <footer class="footer" id="footer"></footer>
        </div>
    </div>

    <script type="module" src="/js/pages/wms.js"></script>
</body>
</html>
